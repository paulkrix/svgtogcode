<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="400" fill="#ffffff" />
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial" font-size="16" text-anchor="middle" fill="#333333">SVG Path Test</text>
  
  <!-- Basic shapes -->
  <rect x="50" y="50" width="50" height="50" fill="#d0d0d0" />
  <circle cx="150" cy="75" r="25" fill="#a0a0a0" />
  <ellipse cx="250" cy="75" rx="30" ry="20" fill="#808080" />
  <line x1="300" y1="50" x2="350" y2="100" stroke="#404040" stroke-width="3" />
  
  <!-- Regular polygon (hexagon) created using path -->
  <path d="M 50,150 L 100,125 L 150,150 L 150,200 L 100,225 L 50,200 Z" fill="#606060" />
  
  <!-- Path with Cubic Bezier (C) -->
  <path d="M 175,150 C 200,120 225,120 250,150 S 300,180 325,150" 
        fill="none" stroke="#303030" stroke-width="3" />
  
  <!-- Path with Quadratic Bezier (Q) -->
  <path d="M 50,250 Q 100,200 150,250 T 250,250" 
        fill="none" stroke="#505050" stroke-width="3" />
  
  <!-- Path with Arcs (A) -->
  <path d="M 275,250 A 50,25 0 0 1 325,275 A 25,50 0 0 1 300,325" 
        fill="none" stroke="#707070" stroke-width="3" />
  
  <!-- Combined path with multiple command types -->
  <path d="M 50,350 h 50 v -30 c 20,-20 40,-20 60,0 v 30 h 50 l -10,30 h -150 Z" fill="#909090" />
  
  <!-- Relative commands path -->
  <path d="m 250,350 c 20,-20 40,-20 60,0 h 30 v 30 h -90 z" fill="#b0b0b0" />
  
  <!-- Path with both absolute and relative commands -->
  <path d="M 100,300 l 50,-20 L 200,300 l -50,20 Z" fill="#d0d0d0" />
  
  <!-- Star shape with sharp corners -->
  <path d="M 350,300 L 370,350 L 350,340 L 330,350 Z" fill="#e0e0e0" />
  
  <!-- Grid lines -->
  <path d="M 0,100 H 400 M 0,200 H 400 M 0,300 H 400 M 100,0 V 400 M 200,0 V 400 M 300,0 V 400"
        stroke="#cccccc" stroke-width="1" fill="none" />
</svg> 