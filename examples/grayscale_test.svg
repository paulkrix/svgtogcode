<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="20" y="30" font-family="Arial" font-size="16" fill="black">Grayscale to Depth Test</text>
  
  <!-- Grayscale gradient test - 10 rectangles of increasing darkness -->
  <rect x="20" y="50" width="36" height="100" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <rect x="56" y="50" width="36" height="100" fill="#e6e6e6" stroke="#000000" stroke-width="1" />
  <rect x="92" y="50" width="36" height="100" fill="#cccccc" stroke="#000000" stroke-width="1" />
  <rect x="128" y="50" width="36" height="100" fill="#b3b3b3" stroke="#000000" stroke-width="1" />
  <rect x="164" y="50" width="36" height="100" fill="#999999" stroke="#000000" stroke-width="1" />
  <rect x="200" y="50" width="36" height="100" fill="#808080" stroke="#000000" stroke-width="1" />
  <rect x="236" y="50" width="36" height="100" fill="#666666" stroke="#000000" stroke-width="1" />
  <rect x="272" y="50" width="36" height="100" fill="#4d4d4d" stroke="#000000" stroke-width="1" />
  <rect x="308" y="50" width="36" height="100" fill="#333333" stroke="#000000" stroke-width="1" />
  <rect x="344" y="50" width="36" height="100" fill="#000000" stroke="#000000" stroke-width="1" />
  
  <!-- Labels -->
  <text x="20" y="170" font-family="Arial" font-size="10" fill="black">0% (Shallowest)</text>
  <text x="330" y="170" font-family="Arial" font-size="10" fill="black">100% (Deepest)</text>
  
  <!-- Color circle examples -->
  <circle cx="50" cy="190" r="10" fill="red" />
  <circle cx="80" cy="190" r="10" fill="green" />
  <circle cx="110" cy="190" r="10" fill="blue" />
  <circle cx="140" cy="190" r="10" fill="yellow" />
  <circle cx="170" cy="190" r="10" fill="purple" />
  
  <!-- Depth scale reference -->
  <line x1="230" y1="180" x2="380" y2="180" stroke="black" stroke-width="1" />
  <line x1="230" y1="177" x2="230" y2="183" stroke="black" stroke-width="1" />
  <line x1="380" y1="177" x2="380" y2="183" stroke="black" stroke-width="1" />
  <text x="230" y="195" font-family="Arial" font-size="10" fill="black">Min Depth</text>
  <text x="350" y="195" font-family="Arial" font-size="10" fill="black">Max Depth</text>
</svg> 