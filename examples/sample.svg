<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rectangle -->
  <rect x="0" y="0" width="200" height="200" fill="#f8f8f8" />
  
  <!-- Grayscale circles -->
  <circle cx="50" cy="50" r="30" fill="#000000" />
  <circle cx="150" cy="50" r="30" fill="#404040" />
  <circle cx="50" cy="150" r="30" fill="#808080" />
  <circle cx="150" cy="150" r="30" fill="#c0c0c0" />
  
  <!-- Center square with gradient -->
  <rect x="75" y="75" width="50" height="50" fill="#808080" />
  
  <!-- Lines -->
  <line x1="0" y1="0" x2="200" y2="200" stroke="#000000" stroke-width="5" />
  <line x1="0" y1="200" x2="200" y2="0" stroke="#404040" stroke-width="5" />
  
  <!-- Path example -->
  <path d="M100,20 C120,40 180,40 180,100 C180,180 80,180 20,100 C20,40 80,40 100,20 Z" fill="none" stroke="#606060" stroke-width="3" />
</svg> 