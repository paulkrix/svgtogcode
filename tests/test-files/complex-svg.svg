<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background grid -->
  <defs>
    <pattern id="smallGrid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#f0f0f0" stroke-width="0.5"/>
    </pattern>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#e0e0e0" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#grid)" />
  
  <!-- Complex shapes with various grayscale values -->
  <!-- Spiral with gradient -->
  <path d="M 400 400 L 410 390 L 420 400 L 410 410 L 400 400 L 390 390 L 380 400 L 390 410 L 400 400 L 420 380 L 440 400 L 420 420 L 400 400 L 380 380 L 360 400 L 380 420 L 400 400 L 430 370 L 460 400 L 430 430 L 400 400 L 370 370 L 340 400 L 370 430 L 400 400 L 440 360 L 480 400 L 440 440 L 400 400 L 360 360 L 320 400 L 360 440 L 400 400 L 450 350 L 500 400 L 450 450 L 400 400 L 350 350 L 300 400 L 350 450 L 400 400" fill="none" stroke="#000000" stroke-width="2"/>
  
  <!-- Set of circles with varying grayscale -->
  <circle cx="200" cy="200" r="100" fill="#000000"/>
  <circle cx="200" cy="200" r="80" fill="#202020"/>
  <circle cx="200" cy="200" r="60" fill="#404040"/>
  <circle cx="200" cy="200" r="40" fill="#606060"/>
  <circle cx="200" cy="200" r="20" fill="#808080"/>
  
  <!-- Set of squares with varying grayscale -->
  <rect x="500" y="100" width="200" height="200" fill="#a0a0a0"/>
  <rect x="520" y="120" width="160" height="160" fill="#808080"/>
  <rect x="540" y="140" width="120" height="120" fill="#606060"/>
  <rect x="560" y="160" width="80" height="80" fill="#404040"/>
  <rect x="580" y="180" width="40" height="40" fill="#202020"/>
  
  <!-- Complex path pattern -->
  <path d="M 100 500 C 140 460, 180 460, 220 500 S 300 540, 340 500 S 420 460, 460 500 S 540 540, 580 500 S 660 460, 700 500" fill="none" stroke="#404040" stroke-width="3"/>
  <path d="M 100 520 C 140 480, 180 480, 220 520 S 300 560, 340 520 S 420 480, 460 520 S 540 560, 580 520 S 660 480, 700 520" fill="none" stroke="#606060" stroke-width="3"/>
  <path d="M 100 540 C 140 500, 180 500, 220 540 S 300 580, 340 540 S 420 500, 460 540 S 540 580, 580 540 S 660 500, 700 540" fill="none" stroke="#808080" stroke-width="3"/>
  
  <!-- Text as path -->
  <path d="M 150 650 L 170 650 L 190 680 L 210 650 L 230 650 L 230 750 L 210 750 L 210 690 L 190 720 L 170 690 L 170 750 L 150 750 Z" fill="#505050"/>
  <path d="M 250 650 L 330 650 L 330 670 L 290 670 L 290 750 L 270 750 L 270 670 L 250 670 Z" fill="#606060"/>
  <path d="M 350 650 C 380 650, 410 680, 410 700 C 410 720, 380 750, 350 750 C 320 750, 290 720, 290 700 C 290 680, 320 650, 350 650 Z M 350 670 C 330 670, 310 685, 310 700 C 310 715, 330 730, 350 730 C 370 730, 390 715, 390 700 C 390 685, 370 670, 350 670 Z" fill="#707070"/>
  
  <!-- Striped pattern -->
  <g id="stripes">
    <rect x="500" y="600" width="200" height="10" fill="#101010"/>
    <rect x="500" y="620" width="200" height="10" fill="#303030"/>
    <rect x="500" y="640" width="200" height="10" fill="#505050"/>
    <rect x="500" y="660" width="200" height="10" fill="#707070"/>
    <rect x="500" y="680" width="200" height="10" fill="#909090"/>
    <rect x="500" y="700" width="200" height="10" fill="#b0b0b0"/>
    <rect x="500" y="720" width="200" height="10" fill="#d0d0d0"/>
    <rect x="500" y="740" width="200" height="10" fill="#f0f0f0"/>
  </g>
</svg> 