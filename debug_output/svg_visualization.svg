<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="300" height="300" fill="#f0f0f0" />
  
  <!-- Outer frame - deep cut (black = deepest) -->
  <rect x="20" y="20" width="260" height="260" fill="none" stroke="#000000" stroke-width="5" />
  
  <!-- Inner decorative border - medium cut -->
  <rect x="40" y="40" width="220" height="220" fill="none" stroke="#808080" stroke-width="3" />
  
  <!-- Company "logo" - multi-depth design -->
  <circle cx="150" cy="150" r="70" fill="#d0d0d0" />
  <circle cx="150" cy="150" r="50" fill="#a0a0a0" />
  <circle cx="150" cy="150" r="30" fill="#707070" />
  <circle cx="150" cy="150" r="15" fill="#404040" />
  
  <!-- Decorative elements with varying depths -->
  <!-- Corners -->
  <circle cx="40" cy="40" r="15" fill="#606060" />
  <circle cx="260" cy="40" r="15" fill="#606060" />
  <circle cx="40" cy="260" r="15" fill="#606060" />
  <circle cx="260" cy="260" r="15" fill="#606060" />
  
  <!-- Text placeholder (shallow cut) -->
  <rect x="100" y="230" width="100" height="20" rx="5" ry="5" fill="#c0c0c0" />
  
  <!-- Decorative line patterns (medium depth) -->
  <line x1="60" y1="60" x2="60" y2="240" stroke="#909090" stroke-width="2" />
  <line x1="80" y1="60" x2="80" y2="240" stroke="#909090" stroke-width="2" />
  <line x1="240" y1="60" x2="240" y2="240" stroke="#909090" stroke-width="2" />
  <line x1="220" y1="60" x2="220" y2="240" stroke="#909090" stroke-width="2" />
  
  <line x1="60" y1="60" x2="240" y2="60" stroke="#909090" stroke-width="2" />
  <line x1="60" y1="80" x2="240" y2="80" stroke="#909090" stroke-width="2" />
  <line x1="60" y1="220" x2="240" y2="220" stroke="#909090" stroke-width="2" />
  <line x1="60" y1="240" x2="240" y2="240" stroke="#909090" stroke-width="2" />
  
  <!-- Decorative path element (medium-deep cut) -->
  <path d="M 150,100 
           C 180,120 200,150 180,180 
           C 160,200 140,200 120,180 
           C 100,150 120,120 150,100 Z" 
        fill="#505050" />
</svg>